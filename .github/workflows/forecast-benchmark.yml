name: Benchmark reproducible de demanda mensual

on:
  push:
    branches: [main]
    paths:
      - "docs/fixtures/demand-monthly-history.json"
      - "docs/fixtures/stockout-censored-demand.json"
      - "scripts/forecasting/**"
      - "requirements-forecasting.txt"
      - ".github/workflows/forecast-benchmark.yml"
  pull_request:
    paths:
      - "docs/fixtures/demand-monthly-history.json"
      - "docs/fixtures/stockout-censored-demand.json"
      - "scripts/forecasting/**"
      - "requirements-forecasting.txt"
      - ".github/workflows/forecast-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Comparar baselines y StatsForecast
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-forecasting.txt

      - name: Instalar dependencias fijadas
        run: python -m pip install --requirement requirements-forecasting.txt

      - name: Ejecutar pruebas del ajuste por quiebre de stock
        run: python -m unittest discover -s scripts/forecasting -p 'test_*.py'

      - name: Ejecutar backtesting walk-forward
        run: python scripts/forecasting/benchmark.py --fixture docs/fixtures/demand-monthly-history.json --stockout-fixture docs/fixtures/stockout-censored-demand.json --output /tmp/demand-benchmark.json

      - name: Publicar resumen del benchmark
        if: always()
        run: |
          if [ -f /tmp/demand-benchmark.json ]; then
            cat /tmp/demand-benchmark.json >> "$GITHUB_STEP_SUMMARY"
          fi
