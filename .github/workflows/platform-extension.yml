name: Validación del arranque de plataforma

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'extensions/lsfusion/**'
      - 'scripts/platform/**'
      - 'vendor/platform/**'
      - 'vendor/mycompany/**'
      - 'build/rubrova/**'
      - 'Iniciar Rubrova*.command'
      - '.github/workflows/platform-extension.yml'
  pull_request:
    paths:
      - 'platform/**'
      - 'extensions/lsfusion/**'
      - 'scripts/platform/**'
      - '.github/workflows/platform-extension.yml'
      - 'vendor/platform/**'
      - 'vendor/mycompany/**'
      - 'build/rubrova/**'
      - 'Iniciar Rubrova*.command'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rubrova-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Prevalidación local compartida
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Ejecutar la misma prevalidación que se usa en macOS local
        env:
          RUBROVA_PREFLIGHT_OUTPUT_DIR: ${{ runner.temp }}/rubrova-preflight
        run: bash scripts/platform/local-preflight.sh --platform
      - name: Publicar el catálogo estructural de fuentes
        uses: actions/upload-artifact@v7
        with:
          name: rubrova-lsf-source-catalog
          path: ${{ runner.temp }}/rubrova-preflight/lsfusion-source-catalog.json
          if-no-files-found: error
          retention-days: 7

  # La compilación sólo prueba que se generaron artefactos. No demuestra que
  # lsFusion 6.2 pueda parsear/cargar todos los módulos ni que sus APIs respeten
  # el contrato HTTP. Los smokes nativos posteriores son la evidencia de runtime.
  build-fork:
    name: Compilar el fork lsFusion + MyCompany de Rubrova
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 25
    concurrency:
      group: rubrova-build-fork-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
      - name: Confirmar la revisión exacta que se va a probar
        shell: bash
        run: |
          expected_sha="${GITHUB_SHA:?GitHub no informó el SHA esperado}"
          checked_out_sha="$(git rev-parse HEAD)"
          printf 'GITHUB_SHA=%s\\nCHECKED_OUT_SHA=%s\\n' "$expected_sha" "$checked_out_sha"
          test "$checked_out_sha" = "$expected_sha"
      - name: Preparar Java 21 y caché Maven
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            build/rubrova/pom.xml
            vendor/platform/**/pom.xml
            vendor/mycompany/pom.xml
      - name: Verificar snapshots y aplicar el parche global de timeout
        run: |
          bash scripts/platform/validate-vendored-sources.sh
          python3 scripts/platform/apply-rubrova-source-patches.py
          # Segunda pasada: demostrar que todos los parches del fuente son idempotentes.
          python3 scripts/platform/apply-rubrova-source-patches.py
          grep -q 'RUBROVA_DEFAULT_EXTERNAL_HTTP_TIMEOUT_MS = 10_000L' vendor/platform/server/src/main/java/lsfusion/server/physics/dev/integration/external/to/CallHTTPAction.java
          grep -Fq 'CONSTRAINT account(Pos p) = cashAccount(p)' vendor/mycompany/src/main/lsfusion/retail/pos/PosPaymentMethod.lsf
          grep -Fq 'System.getProperty("lsfusion.rmi.bindAddress")' vendor/platform/api/src/main/java/lsfusion/base/remote/ZipServerSocket.java
          MARKDOWN_VIEWER_SOURCE=vendor/mycompany/src/main/lsfusion/utils/MarkdownViewer.lsf
          grep -Fq 'marked@18.3.0/lib/marked.umd.js' "$MARKDOWN_VIEWER_SOURCE"
          grep -Fq 'marked-gfm-heading-id@4.1.4/lib/index.umd.js' "$MARKDOWN_VIEWER_SOURCE"
          ! grep -Fq 'onWebClientLoad() +' "$MARKDOWN_VIEWER_SOURCE"
      - name: Compilar lsFusion 6.2, cliente GWT y MyCompany 6.2
        run: mvn -B -ntp -f build/rubrova/pom.xml -Passemble -DskipTests package
      - name: Empaquetar servidor y cliente reutilizando GWT
        shell: bash
        run: |
          set -o pipefail
          # La fase assemble anterior ya compiló las 10 permutaciones GWT.
          # Esta segunda pasada cambia el alcance de dependencias para incluir api-6.2.jar
          # en server.jar y WEB-INF/lib del WAR, pero no debe recompilar los JS de GWT.
          WEBAPP_DIR="vendor/platform/web-client/target/lsfusion-client-6.2"
          test -d "$WEBAPP_DIR"
          GWT_BOOTSTRAP="$(find "$WEBAPP_DIR" -type f -name '*.nocache.js' -print -quit)"
          GWT_FRAGMENT="$(find "$WEBAPP_DIR" -type f -name '*.cache.js' -print -quit)"
          test -n "$GWT_BOOTSTRAP"
          test -n "$GWT_FRAGMENT"
          echo "GWT compilado reutilizado: $GWT_BOOTSTRAP"
          echo "Fragmento GWT reutilizado: $GWT_FRAGMENT"
          timeout --signal=TERM --kill-after=30s 8m \
            mvn -B -ntp -f vendor/platform/pom.xml -pl server,web-client -am \
              -DskipTests -Dgwt.skipCompilation=true package \
              | tee "$RUNNER_TEMP/rubrova-gwt-repackage.log"
          grep -Fq "GWT compilation is skipped" "$RUNNER_TEMP/rubrova-gwt-repackage.log" || {
            echo "ERROR: el plugin GWT no confirmó que omitió la segunda compilación." >&2
            exit 1
          }
          if grep -Fq "Compiling module lsfusion.gwt.main" "$RUNNER_TEMP/rubrova-gwt-repackage.log"; then
            echo "ERROR: se volvió a ejecutar GWT durante el empaquetado secundario." >&2
            exit 1
          fi
      - name: Verificar y preparar los artefactos propios del runtime
        shell: bash
        run: |
          SERVER_JAR="vendor/platform/server/target/lsfusion-server-6.2.jar"
          LOGICS_JAR="vendor/mycompany/target/lsfusion-server-6.2.jar"
          CLIENT_WAR="vendor/platform/web-client/target/lsfusion-client-6.2.war"
          test -s "$SERVER_JAR"
          test -s "$LOGICS_JAR"
          test -s "$CLIENT_WAR"
          unzip -Z1 "$SERVER_JAR" | grep -F -x 'lsfusion/server/logics/BusinessLogicsBootstrap.class' >/dev/null
          unzip -Z1 "$SERVER_JAR" | grep -F -x 'lsfusion/base/DaemonThreadFactory.class' >/dev/null
          unzip -Z1 "$SERVER_JAR" | grep -F -x 'lsfusion/base/log/CustodianDailyRollingFileAppender.class' >/dev/null
          unzip -Z1 "$SERVER_JAR" | grep -F -x 'org/apache/log4j/rolling/RollingFileAppender.class' >/dev/null
          unzip -Z1 "$LOGICS_JAR" | grep -Eq '(^|/)MyCompany[.]lsf$'
          # El perfil assemble marca api como provided para la lógica; el WAR web necesita incluirla.
          unzip -Z1 "$CLIENT_WAR" | grep -F -x 'WEB-INF/lib/api-6.2.jar' >/dev/null
          unzip -Z1 "$CLIENT_WAR" | grep -E '\.nocache\.js$' >/dev/null
          unzip -Z1 "$CLIENT_WAR" | grep -E '\.cache\.js$' >/dev/null
          unzip -p "$CLIENT_WAR" WEB-INF/lib/api-6.2.jar > "$RUNNER_TEMP/rubrova-client-api.jar"
          unzip -Z1 "$RUNNER_TEMP/rubrova-client-api.jar" | grep -F -x 'lsfusion/base/DaemonThreadFactory.class' >/dev/null
          mkdir -p "$RUNNER_TEMP/rubrova-runtime-artifacts"
          cp "$SERVER_JAR" "$RUNNER_TEMP/rubrova-runtime-artifacts/server.jar"
          cp "$LOGICS_JAR" "$RUNNER_TEMP/rubrova-runtime-artifacts/logics.jar"
          cp "$CLIENT_WAR" "$RUNNER_TEMP/rubrova-runtime-artifacts/client.war"
          test -s "$RUNNER_TEMP/rubrova-runtime-artifacts/server.jar"
          test -s "$RUNNER_TEMP/rubrova-runtime-artifacts/logics.jar"
          test -s "$RUNNER_TEMP/rubrova-runtime-artifacts/client.war"
          echo "Servidor autónomo: API, logging y runtime están incluidos en server.jar."
          echo "Cliente GWT: WEB-INF/lib/api-6.2.jar está incluido para el arranque de Spring/Tomcat."
          echo "Lógica MyCompany y cliente web salen del reactor de Rubrova."
      - name: Publicar artefactos del runtime para el smoke funcional
        uses: actions/upload-artifact@v7
        with:
          name: rubrova-runtime-application
          path: ${{ runner.temp }}/rubrova-runtime-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  native-runtime-smoke:
    if: github.event_name == 'workflow_dispatch'
    name: Diagnóstico de servidor nativo sin Docker (Linux x86_64, no bloqueante)
    runs-on: ubuntu-24.04
    # Linux nativo queda como diagnóstico; la validación obligatoria de Linux es Docker.
    continue-on-error: true
    needs: [validate, build-fork]
    timeout-minutes: 35
    concurrency:
      group: rubrova-native-runtime-smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
      - name: Confirmar la revisión exacta que se va a probar
        shell: bash
        run: |
          expected_sha="${GITHUB_SHA:?GitHub no informó el SHA esperado}"
          checked_out_sha="$(git rev-parse HEAD)"
          test "$checked_out_sha" = "$expected_sha"
      - name: Descargar artefactos compilados desde el mismo SHA
        uses: actions/download-artifact@v8
        with:
          name: rubrova-runtime-application
          path: ${{ runner.temp }}/rubrova-runtime-artifacts
      - name: Preparar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Instalar PostgreSQL 18 nativo en el runner
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          sudo install -d -m 0755 /usr/share/keyrings
          curl --fail --location --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-18 postgresql-client-18 iproute2
          test -x /usr/lib/postgresql/18/bin/initdb
          /usr/lib/postgresql/18/bin/pg_ctl --version
      - name: Preparar Chromium para la inspección de interfaz
        env:
          PLAYWRIGHT_VENV: ${{ runner.temp }}/rubrova-native-playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/rubrova-native-playwright-browsers
        run: |
          python3 -m venv "$PLAYWRIGHT_VENV"
          "$PLAYWRIGHT_VENV/bin/python" -m pip install --disable-pip-version-check playwright==1.65.2
          "$PLAYWRIGHT_VENV/bin/python" -m playwright install chromium
          "$PLAYWRIGHT_VENV/bin/python" - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              browser.close()

          print("RUBROVA_PLAYWRIGHT_BROWSER_READY=true")
          PY
      - name: Validar sintaxis del runtime nativo
        run: |
          bash -n scripts/platform/test-runtime-native-smoke.sh
          python3 -m py_compile scripts/platform/runtime-config.py scripts/platform/run-local-native-preview.py scripts/platform/native_runtime_url.py scripts/platform/test_native_runtime_url.py scripts/platform/inspect-mycompany-ui.py
          python3 scripts/platform/test_native_runtime_url.py
      - name: Ejecutar servidor local y comprobar interfaz sin salida a Internet
        env:
          RUBROVA_BUILD_ARTIFACTS_DIR: ${{ runner.temp }}/rubrova-runtime-artifacts
          RUBROVA_POSTGRES_BIN: /usr/lib/postgresql/18/bin
          RUBROVA_PLAYWRIGHT_PYTHON: ${{ runner.temp }}/rubrova-native-playwright/bin/python
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/rubrova-native-playwright-browsers
          RUBROVA_NATIVE_SMOKE_DIR: ${{ runner.temp }}/rubrova-native-smoke
          RUBROVA_NATIVE_SCREENSHOT: ${{ runner.temp }}/rubrova-native-smoke/rubrova-native-login.png
          RUBROVA_RUNTIME_CONFIG_PATH: ${{ runner.temp }}/rubrova-native-smoke/runtime-config.json
          RUBROVA_BLOCK_EGRESS: "true"
          RUBROVA_KEEP_NATIVE_SMOKE_DATA: "true"
          RUBROVA_NATIVE_STARTUP_TIMEOUT_SECONDS: 1200
        run: bash scripts/platform/test-runtime-native-smoke.sh
      - name: Conservar evidencia del runtime nativo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rubrova-native-runtime-smoke
          path: |
            ${{ runner.temp }}/rubrova-native-smoke/native-runtime.log
            ${{ runner.temp }}/rubrova-native-smoke/native-diagnostics.log
            ${{ runner.temp }}/rubrova-native-smoke/demo-runtime.log
            ${{ runner.temp }}/rubrova-native-smoke/demo-ui-smoke.log
            ${{ runner.temp }}/rubrova-native-smoke/*.png
            ${{ runner.temp }}/rubrova-native-smoke/ui-smoke.log
          if-no-files-found: warn

  runtime-smoke:
    if: github.event_name == 'workflow_dispatch'
    name: Diagnóstico POS sobre runtime Docker/Linux (no bloqueante)
    runs-on: ubuntu-latest
    needs: [validate, build-fork]
    timeout-minutes: 30
    concurrency:
      group: rubrova-runtime-smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
      - name: Confirmar la revisión exacta que se va a probar
        shell: bash
        run: |
          expected_sha="${GITHUB_SHA:?GitHub no informó el SHA esperado}"
          checked_out_sha="$(git rev-parse HEAD)"
          printf 'GITHUB_SHA=%s\\nCHECKED_OUT_SHA=%s\\n' "$expected_sha" "$checked_out_sha"
          test "$checked_out_sha" = "$expected_sha"
      - name: Descargar artefactos compilados desde el mismo SHA
        uses: actions/download-artifact@v8
        with:
          name: rubrova-runtime-application
          path: ${{ runner.temp }}/rubrova-runtime-artifacts
      - name: Confirmar integridad de los artefactos de aplicación
        shell: bash
        run: |
          test -s "${{ runner.temp }}/rubrova-runtime-artifacts/server.jar"
          test -s "${{ runner.temp }}/rubrova-runtime-artifacts/logics.jar"
          test -s "${{ runner.temp }}/rubrova-runtime-artifacts/client.war"
      - name: Confirmar Docker Engine y Compose
        run: |
          docker version
          docker compose version
      - name: Preparar Chromium para inspección de interfaz
        env:
          PLAYWRIGHT_VENV: ${{ runner.temp }}/rubrova-playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/rubrova-playwright-browsers
        run: |
          python3 -m venv "$PLAYWRIGHT_VENV"
          "$PLAYWRIGHT_VENV/bin/python" -m pip install --disable-pip-version-check playwright==1.65.2
          "$PLAYWRIGHT_VENV/bin/python" -m playwright install chromium
          "$PLAYWRIGHT_VENV/bin/python" - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              browser.close()

          print("RUBROVA_PLAYWRIGHT_BROWSER_READY=true")
          PY
      - name: Validar sintaxis de los scripts de runtime
        run: |
          bash -n scripts/platform/test-runtime-smoke.sh
          bash -n scripts/platform/build-rubrova-runtime-images.sh
      - name: Levantar runtime Rubrova, inspeccionar POS y limpiar datos efímeros
        id: docker-pos-acceptance
        continue-on-error: true
        env:
          RUBROVA_STARTUP_TIMEOUT_SECONDS: 900
          RUBROVA_BUILD_ARTIFACTS_DIR: ${{ runner.temp }}/rubrova-runtime-artifacts
          RUBROVA_SKIP_OFFICIAL_LOGIC_JAR: "true"
          RUBROVA_PLAYWRIGHT_PYTHON: ${{ runner.temp }}/rubrova-playwright/bin/python
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/rubrova-playwright-browsers
          RUBROVA_UI_SCREENSHOT: ${{ runner.temp }}/rubrova-mycompany-ui.png
          RUBROVA_UI_TEST_LOGIN: "true"
          RUBROVA_UI_TEST_USERNAME: "admin"
          RUBROVA_RMI_TIMEOUT_SECONDS: 180
          RUBROVA_ONSTARTED_TIMEOUT_SECONDS: 180
          RUBROVA_UI_READY_TIMEOUT_SECONDS: 180
        run: bash scripts/platform/test-runtime-smoke.sh
      - name: Informar el resultado del diagnóstico Docker/Linux
        if: steps.docker-pos-acceptance.outcome == 'failure'
        run: |
          echo "::warning title=Docker/Linux no aprobado::El cliente web no respondió durante el smoke Docker/Linux. Se conserva el fallo para investigación; no bloquea la aceptación del runtime nativo macOS/Linux."
      - name: Conservar capturas de acceso y pantalla autenticada
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rubrova-mycompany-ui
          path: |
            ${{ runner.temp }}/rubrova-mycompany-ui.png
            ${{ runner.temp }}/rubrova-mycompany-ui-after-login.png
            ${{ runner.temp }}/rubrova-mycompany-ui-retail.png
            ${{ runner.temp }}/rubrova-mycompany-ui-pos.png
            ${{ runner.temp }}/rubrova-mycompany-ui-session.png
            ${{ runner.temp }}/rubrova-mycompany-ui-item.png
            ${{ runner.temp }}/rubrova-mycompany-ui-payment.png
            ${{ runner.temp }}/rubrova-mycompany-ui-sale.png
            ${{ runner.temp }}/rubrova-mycompany-ui-session-closed.png
            ${{ runner.temp }}/rubrova-mycompany-ui-after-restart.png
            ${{ runner.temp }}/rubrova-mycompany-ui-after-restart-after-login.png
          if-no-files-found: warn

  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
      - name: Validar sintaxis de PowerShell
        shell: pwsh
        run: |
          $files = @(
            'scripts/platform/prepare-mycompany-6.2.ps1',
            'scripts/platform/deploy-mycompany-6.2.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

  # Gate obligatorio en Apple Silicon: esperar carga de lógica, autenticarse,
  # validar cuerpo/esquema/conteos de las APIs de dominio y recorrer el flujo POS.
  # HTTP 200 por sí solo nunca se interpreta como aceptación de contrato.
  native-runtime-smoke-macos-arm64:
    name: Smoke de servidor nativo sin Docker (macOS ARM64)
    runs-on: macos-26
    needs: [validate, build-fork]
    timeout-minutes: 45
    concurrency:
      group: rubrova-native-runtime-smoke-macos-arm64-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
      - name: Confirmar la revisión exacta y la arquitectura Apple Silicon
        shell: bash
        run: |
          expected_sha="${GITHUB_SHA:?GitHub no informó el SHA esperado}"
          checked_out_sha="$(git rev-parse HEAD)"
          printf 'GITHUB_SHA=%s\\nCHECKED_OUT_SHA=%s\\n' "$expected_sha" "$checked_out_sha"
          test "$checked_out_sha" = "$expected_sha"
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          sw_vers
          echo "RUBROVA_MACOS_ARCH=arm64"
      - name: Preparar Node y validar el lock de extensiones
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Ejecutar validaciones de extensiones
        run: node --test scripts/platform/validate-mycompany-extension.test.mjs
      - name: Validar scripts y staging con herramientas macOS
        run: |
          bash -n scripts/platform/prepare-mycompany-6.2.sh
          bash -n scripts/platform/deploy-mycompany-6.2.sh
          bash -n scripts/platform/test-runtime-native-smoke.sh
          bash scripts/platform/test-deploy-mycompany-6.2.sh
      - name: Descargar los artefactos compilados desde el mismo SHA
        uses: actions/download-artifact@v8
        with:
          name: rubrova-runtime-application
          path: ${{ runner.temp }}/rubrova-runtime-artifacts
      - name: Preparar Java 21 ARM64
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Verificar que Java se ejecuta nativamente en ARM64
        shell: bash
        run: |
          java -version
          java -XshowSettings:properties -version 2>&1 | grep -E 'os.arch = (aarch64|arm64)'
      - name: Preparar Python 3.13 y PostgreSQL 18 ARM64
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Verificar construcción de rutas API del runtime nativo
        run: |
          python3 -m py_compile scripts/platform/native_runtime_url.py scripts/platform/test_native_runtime_url.py scripts/platform/inspect-mycompany-ui.py
          python3 scripts/platform/test_native_runtime_url.py
      - name: Instalar y verificar PostgreSQL 18 nativo
        shell: bash
        run: |
          if ! brew list --versions postgresql@18 >/dev/null 2>&1; then
            brew install postgresql@18
          fi
          POSTGRES_BIN="$(brew --prefix postgresql@18)/bin"
          test -x "$POSTGRES_BIN/initdb"
          test -x "$POSTGRES_BIN/pg_ctl"
          test -x "$POSTGRES_BIN/pg_isready"
          test -x "$POSTGRES_BIN/createdb"
          test -x "$POSTGRES_BIN/psql"
          "$POSTGRES_BIN/pg_ctl" --version
          file "$POSTGRES_BIN/postgres" | grep -E 'arm64|aarch64'
          echo "RUBROVA_POSTGRES_BIN=$POSTGRES_BIN" >> "$GITHUB_ENV"
      - name: Preparar Chromium ARM64 para la inspección de interfaz
        shell: bash
        env:
          PLAYWRIGHT_VENV: ${{ runner.temp }}/rubrova-native-playwright
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/rubrova-native-playwright-browsers
        run: |
          python3 -m venv "$PLAYWRIGHT_VENV"
          "$PLAYWRIGHT_VENV/bin/python" -m pip install --disable-pip-version-check playwright==1.65.2
          "$PLAYWRIGHT_VENV/bin/python" -m playwright install chromium
          "$PLAYWRIGHT_VENV/bin/python" - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(headless=True)
              browser.close()

          print("RUBROVA_PLAYWRIGHT_BROWSER_READY=true")
          PY
      - name: Confirmar integridad de los artefactos compartidos
        shell: bash
        run: |
          for artifact in server.jar logics.jar client.war; do
            test -s "${{ runner.temp }}/rubrova-runtime-artifacts/$artifact"
            shasum -a 256 "${{ runner.temp }}/rubrova-runtime-artifacts/$artifact"
          done
      - name: Iniciar Rubrova con Java, PostgreSQL y Tomcat nativos en macOS ARM64
        shell: bash
        env:
          RUBROVA_BUILD_ARTIFACTS_DIR: ${{ runner.temp }}/rubrova-runtime-artifacts
          RUBROVA_PLAYWRIGHT_PYTHON: ${{ runner.temp }}/rubrova-native-playwright/bin/python
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/rubrova-native-playwright-browsers
          RUBROVA_NATIVE_SMOKE_DIR: ${{ runner.temp }}/rubrova-native-smoke-macos-arm64
          RUBROVA_NATIVE_SCREENSHOT: ${{ runner.temp }}/rubrova-native-smoke-macos-arm64/rubrova-native-login.png
