name: Validación del arranque de plataforma

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'extensions/lsfusion/**'
      - 'scripts/platform/**'
      - 'vendor/platform/**'
      - 'vendor/mycompany/**'
      - 'build/rubrova/**'
      - '.github/workflows/platform-extension.yml'
  pull_request:
    paths:
      - 'platform/**'
      - 'extensions/lsfusion/**'
      - 'scripts/platform/**'
      - '.github/workflows/platform-extension.yml'
  workflow_dispatch:
    inputs:
      validate_macos:
        description: "Ejecutar la validación completa de macOS ARM64 (consumo mayor de Actions)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validar lock, extensión y glosario
        run: node --test scripts/platform/validate-mycompany-extension.test.mjs
      - name: Validar scripts de shell
        run: |
          bash -n scripts/platform/prepare-mycompany-6.2.sh
          bash -n scripts/platform/deploy-mycompany-6.2.sh
          bash -n scripts/platform/test-deploy-mycompany-6.2.sh
          bash -n scripts/platform/test-runtime-smoke.sh
          bash -n scripts/platform/run-local-preview-macos.sh
          bash -n scripts/platform/build-rubrova-runtime-images.sh
          bash scripts/platform/test-deploy-mycompany-6.2.sh

  build-fork:
    name: Compilar el fork lsFusion + MyCompany de Rubrova
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 45
    concurrency:
      group: rubrova-build-fork-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
      - name: Confirmar la revisión exacta que se va a probar
        shell: bash
        run: |
          expected_sha="${GITHUB_SHA:?GitHub no informó el SHA esperado}"
          checked_out_sha="$(git rev-parse HEAD)"
          printf 'GITHUB_SHA=%s\\nCHECKED_OUT_SHA=%s\\n' "$expected_sha" "$checked_out_sha"
          test "$checked_out_sha" = "$expected_sha"
      - name: Preparar Java 21 y caché Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            build/rubrova/pom.xml
            vendor/platform/**/pom.xml
            vendor/mycompany/pom.xml
      - name: Verificar snapshots y aplicar el parche global de timeout
        run: |
          bash scripts/platform/validate-vendored-sources.sh
          python3 scripts/platform/apply-rubrova-source-patches.py
          # Segunda pasada: demostrar que todos los parches del fuente son idempotentes.
          python3 scripts/platform/apply-rubrova-source-patches.py
          grep -q 'RUBROVA_DEFAULT_EXTERNAL_HTTP_TIMEOUT_MS = 10_000L' vendor/platform/server/src/main/java/lsfusion/server/physics/dev/integration/external/to/CallHTTPAction.java
          grep -Fq 'CONSTRAINT account(Pos p) = cashAccount(p)' vendor/mycompany/src/main/lsfusion/retail/pos/PosPaymentMethod.lsf
      - name: Compilar lsFusion 6.2, cliente GWT y MyCompany 6.2
        run: mvn -B -ntp -f build/rubrova/pom.xml -Passemble -DskipTests package
      - name: Recompilar servidor y cliente web con dependencias de runtime
        run: mvn -B -ntp -f vendor/platform/pom.xml -pl server,web-client -am -DskipTests package
      - name: Verificar y preparar los artefactos propios del runtime
        shell: bash
        run: |
          SERVER_JAR="vendor/platform/server/target/lsfusion-server-6.2.jar"
          LOGICS_JAR="vendor/mycompany/target/lsfusion-server-6.2.jar"
          CLIENT_WAR="vendor/platform/web-client/target/lsfusion-client-6.2.war"
          test -s "$SERVER_JAR"
          test -s "$LOGICS_JAR"
          test -s "$CLIENT_WAR"
          unzip -Z1 "$SERVER_JAR" | grep -F -x 'lsfusion/server/logics/BusinessLogicsBootstrap.class' >/dev/null
          unzip -Z1 "$SERVER_JAR" | grep -F -x 'lsfusion/base/DaemonThreadFactory.class' >/dev/null
          unzip -Z1 "$SERVER_JAR" | grep -F -x 'lsfusion/base/log/CustodianDailyRollingFileAppender.class' >/dev/null
          unzip -Z1 "$SERVER_JAR" | grep -F -x 'org/apache/log4j/rolling/RollingFileAppender.class' >/dev/null
          unzip -Z1 "$LOGICS_JAR" | grep -Eq '(^|/)MyCompany[.]lsf$'
          # El perfil assemble marca api como provided para la lógica; el WAR web necesita incluirla.
          unzip -Z1 "$CLIENT_WAR" | grep -F -x 'WEB-INF/lib/api-6.2.jar' >/dev/null
          unzip -p "$CLIENT_WAR" WEB-INF/lib/api-6.2.jar > "$RUNNER_TEMP/rubrova-client-api.jar"
          unzip -Z1 "$RUNNER_TEMP/rubrova-client-api.jar" | grep -F -x 'lsfusion/base/DaemonThreadFactory.class' >/dev/null
          mkdir -p "$RUNNER_TEMP/rubrova-runtime-artifacts"
          cp "$SERVER_JAR" "$RUNNER_TEMP/rubrova-runtime-artifacts/server.jar"
          cp "$LOGICS_JAR" "$RUNNER_TEMP/rubrova-runtime-artifacts/logics.jar"
          cp "$CLIENT_WAR" "$RUNNER_TEMP/rubrova-runtime-artifacts/client.war"
          test -s "$RUNNER_TEMP/rubrova-runtime-artifacts/server.jar"
          test -s "$RUNNER_TEMP/rubrova-runtime-artifacts/logics.jar"
          test -s "$RUNNER_TEMP/rubrova-runtime-artifacts/client.war"
          echo "Servidor autónomo: API, logging y runtime están incluidos en server.jar."
          echo "Cliente GWT: WEB-INF/lib/api-6.2.jar está incluido para el arranque de Spring/Tomcat."
          echo "Lógica MyCompany y cliente web salen del reactor de Rubrova."
      - name: Publicar artefactos del runtime para el smoke funcional
        uses: actions/upload-artifact@v4
        with:
          name: rubrova-runtime-application
          path: ${{ runner.temp }}/rubrova-runtime-artifacts/
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  runtime-smoke:
    name: Smoke POS sobre runtime construido desde fuentes Rubrova (Linux x86_64)
    runs-on: ubuntu-latest
    needs: [validate, build-fork]
    timeout-minutes: 30
    concurrency:
      group: rubrova-runtime-smoke-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
      - name: Confirmar la revisión exacta que se va a probar
        shell: bash
        run: |
          expected_sha="${GITHUB_SHA:?GitHub no informó el SHA esperado}"
          checked_out_sha="$(git rev-parse HEAD)"
          printf 'GITHUB_SHA=%s\\nCHECKED_OUT_SHA=%s\\n' "$expected_sha" "$checked_out_sha"
          test "$checked_out_sha" = "$expected_sha"
      - name: Descargar artefactos compilados desde el mismo SHA
        uses: actions/download-artifact@v4
        with:
          name: rubrova-runtime-application
          path: ${{ runner.temp }}/rubrova-runtime-artifacts
      - name: Confirmar integridad de los artefactos de aplicación
        shell: bash
        run: |
          test -s "${{ runner.temp }}/rubrova-runtime-artifacts/server.jar"
          test -s "${{ runner.temp }}/rubrova-runtime-artifacts/logics.jar"
          test -s "${{ runner.temp }}/rubrova-runtime-artifacts/client.war"
      - name: Confirmar Docker Engine y Compose
        run: |
          docker version
          docker compose version
      - name: Preparar Chromium para inspección de interfaz
        env:
          PLAYWRIGHT_VENV: ${{ runner.temp }}/rubrova-playwright
        run: |
          python3 -m venv "$PLAYWRIGHT_VENV"
          "$PLAYWRIGHT_VENV/bin/python" -m pip install --disable-pip-version-check playwright==1.65.2
          "$PLAYWRIGHT_VENV/bin/python" -m playwright install chromium
      - name: Validar sintaxis de los scripts de runtime
        run: |
          bash -n scripts/platform/test-runtime-smoke.sh
          bash -n scripts/platform/build-rubrova-runtime-images.sh
      - name: Levantar runtime Rubrova, inspeccionar POS y limpiar datos efímeros
        env:
          RUBROVA_STARTUP_TIMEOUT_SECONDS: 900
          RUBROVA_BUILD_ARTIFACTS_DIR: ${{ runner.temp }}/rubrova-runtime-artifacts
          RUBROVA_SKIP_OFFICIAL_LOGIC_JAR: "true"
          RUBROVA_PLAYWRIGHT_PYTHON: ${{ runner.temp }}/rubrova-playwright/bin/python
          RUBROVA_UI_SCREENSHOT: ${{ runner.temp }}/rubrova-mycompany-ui.png
          RUBROVA_UI_TEST_LOGIN: "true"
          RUBROVA_UI_TEST_USERNAME: "admin"
          RUBROVA_RMI_TIMEOUT_SECONDS: 180
          RUBROVA_ONSTARTED_TIMEOUT_SECONDS: 180
          RUBROVA_UI_READY_TIMEOUT_SECONDS: 180
        run: bash scripts/platform/test-runtime-smoke.sh
      - name: Conservar capturas de acceso y pantalla autenticada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubrova-mycompany-ui
          path: |
            ${{ runner.temp }}/rubrova-mycompany-ui.png
            ${{ runner.temp }}/rubrova-mycompany-ui-after-login.png
            ${{ runner.temp }}/rubrova-mycompany-ui-retail.png
            ${{ runner.temp }}/rubrova-mycompany-ui-pos.png
            ${{ runner.temp }}/rubrova-mycompany-ui-session.png
            ${{ runner.temp }}/rubrova-mycompany-ui-item.png
            ${{ runner.temp }}/rubrova-mycompany-ui-payment.png
            ${{ runner.temp }}/rubrova-mycompany-ui-sale.png
            ${{ runner.temp }}/rubrova-mycompany-ui-session-closed.png
            ${{ runner.temp }}/rubrova-mycompany-ui-after-restart.png
            ${{ runner.temp }}/rubrova-mycompany-ui-after-restart-after-login.png
          if-no-files-found: warn

  validate-windows:
    runs-on: windows-latest
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
      - name: Validar sintaxis de PowerShell
        shell: pwsh
        run: |
          $files = @(
            'scripts/platform/prepare-mycompany-6.2.ps1',
            'scripts/platform/deploy-mycompany-6.2.ps1'
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

  validate-macos-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.validate_macos
    name: Validación macOS Apple Silicon
    runs-on: macos-26
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7
      - name: Confirmar que el runner es macOS ARM64
        run: |
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          sw_vers
      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validar lock, extensión y glosario
        run: node --test scripts/platform/validate-mycompany-extension.test.mjs
      - name: Validar scripts y staging con herramientas macOS
        run: |
          bash -n scripts/platform/prepare-mycompany-6.2.sh
          bash -n scripts/platform/deploy-mycompany-6.2.sh
          bash -n scripts/platform/build-rubrova-runtime-images.sh
          bash scripts/platform/test-deploy-mycompany-6.2.sh
      - name: Descargar artefactos; verificar JAR y calcular SHA-256 del Compose
        run: bash scripts/platform/prepare-mycompany-6.2.sh
      - name: Confirmar que la caché existente se vuelve a verificar
        run: bash scripts/platform/prepare-mycompany-6.2.sh
