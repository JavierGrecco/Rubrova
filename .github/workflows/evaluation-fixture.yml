name: Validación del dataset de evaluación

on:
  push:
    branches: [main]
    paths:
      - "docs/fixtures/platform-evaluation.json"
      - "scripts/evaluation/**"
      - ".github/workflows/evaluation-fixture.yml"
  pull_request:
    paths:
      - "docs/fixtures/platform-evaluation.json"
      - "scripts/evaluation/**"
      - ".github/workflows/evaluation-fixture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar dataset y reglas aritméticas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Ejecutar pruebas del validador
        run: node --test scripts/evaluation/fixture-validator.test.mjs

      - name: Validar el dataset canónico
        run: node scripts/evaluation/validate-fixture.mjs
