name: Incorporar fuentes propias de Rubrova

on:
  push:
    branches: [main]
    paths:
      - 'platform/source-lock.json'
      - 'scripts/platform/vendor-upstream-sources.sh'
      - 'scripts/platform/validate-vendored-sources.sh'
      - 'build/rubrova/pom.xml'
      - '.github/workflows/vendor-upstream-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rubrova-vendor-source-import
  cancel-in-progress: false

jobs:
  vendor-and-build:
    name: Incorporar y comprobar fuentes fijadas
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obtener Rubrova
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validar sintaxis de los scripts
        run: |
          bash -n scripts/platform/vendor-upstream-sources.sh
          bash -n scripts/platform/validate-vendored-sources.sh

      - name: Incorporar snapshots completos de lsFusion y MyCompany
        id: import
        run: bash scripts/platform/vendor-upstream-sources.sh

      - name: Validar integridad de los árboles, licencias y rutas Maven
        id: validate
        run: bash scripts/platform/validate-vendored-sources.sh

      - name: Compilar desde el código fuente incorporado
        id: source_build
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B -ntp -Passemble -DskipTests -f build/rubrova/pom.xml package 2>&1 | tee build/source-build.log

      - name: Conservar el resultado de la compilación fuente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubrova-build-from-vendored-sources
          path: |
            build/source-build.log
            vendor/platform/server/target/
            vendor/platform/web-client/target/
            vendor/mycompany/target/
          if-no-files-found: warn
          retention-days: 30

      - name: Integrar las fuentes completas en main
        if: steps.import.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/
          if git diff --cached --quiet; then
            echo "Los snapshots ya están incorporados; no hay un nuevo commit."
          else
            git commit -m "vendor: incorporate pinned MyCompany 6.2 and lsFusion 6.2 sources"
            git push origin HEAD:main
          fi

      - name: Informar si la compilación inicial necesita correcciones
        if: steps.source_build.outcome == 'failure'
        run: |
          echo "::warning::Las fuentes fueron incorporadas y validadas, pero el primer build Maven no terminó correctamente. Revisar el artefacto rubrova-build-from-vendored-sources antes de declarar compilación fuente aprobada."
