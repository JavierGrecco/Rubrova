name: Incorporar fuentes propias de Rubrova

on:
  push:
    branches: [main]
    paths:
      - 'platform/source-lock.json'
      - 'scripts/platform/vendor-upstream-sources.sh'
      - 'scripts/platform/validate-vendored-sources.sh'
      - 'scripts/platform/apply-rubrova-source-patches.py'
      - 'build/rubrova/pom.xml'
      - '.github/workflows/vendor-upstream-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rubrova-vendor-source-import
  cancel-in-progress: true

jobs:
  vendor-and-build:
    name: Incorporar y comprobar fuentes fijadas
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Obtener Rubrova
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Preparar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validar sintaxis de los scripts
        run: |
          bash -n scripts/platform/vendor-upstream-sources.sh
          bash -n scripts/platform/validate-vendored-sources.sh

      - name: Incorporar snapshots completos de lsFusion y MyCompany
        id: import
        run: bash scripts/platform/vendor-upstream-sources.sh

      - name: Validar integridad de los árboles, licencias y rutas Maven
        id: validate
        run: bash scripts/platform/validate-vendored-sources.sh


      - name: Aplicar protecciones Rubrova sobre las fuentes del motor
        run: python3 scripts/platform/apply-rubrova-source-patches.py

      - name: Integrar las fuentes completas en main
        if: steps.import.outcome == 'success' && steps.validate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+JavierGrecco@users.noreply.github.com"
          git add vendor/
          if git diff --cached --quiet; then
            echo "Los snapshots ya están incorporados; no hay un nuevo commit."
          else
            git commit -m "vendor: incorporate pinned MyCompany 6.2 and lsFusion 6.2 sources"
            pushed=false
            for attempt in 1 2 3 4 5; do
              echo "Sincronización con main, intento $attempt/5."
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "No se pudo rebasar el snapshot sobre main. Se requiere revisión manual." >&2
                exit 1
              fi
              if git push origin HEAD:refs/heads/main; then
                pushed=true
                break
              fi
              echo "main avanzó durante el push; se volverá a leer y rebasar antes de reintentar." >&2
              sleep 2
            done
            if [[ "$pushed" != "true" ]]; then
              echo "No se pudo integrar el snapshot después de cinco intentos. No se fuerza el push." >&2
              exit 1
            fi
          fi

      - name: Compilar desde el código fuente incorporado
        id: source_build
        continue-on-error: true
        run: |
          set -o pipefail
          mvn -B -ntp -Passemble -DskipTests -f build/rubrova/pom.xml package 2>&1 | tee build/source-build.log

      - name: Conservar el resultado de la compilación fuente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rubrova-build-from-vendored-sources
          path: |
            build/source-build.log
            vendor/platform/server/target/
            vendor/platform/web-client/target/
            vendor/mycompany/target/
          if-no-files-found: warn
          retention-days: 30

      - name: Informar si la compilación inicial necesita correcciones
        if: steps.source_build.outcome == 'failure'
        run: |
          echo "::warning::Las fuentes ya están incorporadas, pero el primer build Maven no terminó correctamente. Revisar el artefacto rubrova-build-from-vendored-sources antes de declarar compilación fuente aprobada."
