name: Evaluación del planificador de reposición

on:
  push:
    branches: [main]
    paths:
      - "docs/fixtures/replenishment-planning.json"
      - "docs/fixtures/mycompany-replenishment-snapshot.json"
      - "docs/fixtures/mycompany-native-replenishment-export.json"
      - "docs/fixtures/replenishment-planning-policy.json"
      - "docs/PROJECTED_STOCK_AND_REPLENISHMENT.md"
      - "scripts/replenishment/**"
      - ".github/workflows/replenishment-planner.yml"
      - "scripts/platform/local-preflight.sh"
  pull_request:
    paths:
      - "docs/fixtures/replenishment-planning.json"
      - "docs/fixtures/mycompany-replenishment-snapshot.json"
      - "docs/fixtures/mycompany-native-replenishment-export.json"
      - "docs/fixtures/replenishment-planning-policy.json"
      - "docs/PROJECTED_STOCK_AND_REPLENISHMENT.md"
      - "scripts/replenishment/**"
      - ".github/workflows/replenishment-planner.yml"
      - "scripts/platform/local-preflight.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Prevalidación compartida de reposición
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Ejecutar la misma prevalidación local de reposición
        env:
          PYTHON_BIN: python
          RUBROVA_PREFLIGHT_OUTPUT_DIR: ${{ runner.temp }}/rubrova-preflight
        run: bash scripts/platform/local-preflight.sh --replenishment
      - name: Publicar resumen de evaluación
        if: always()
        run: |
          for report in \
            replenishment-planning.json \
            mycompany-replenishment-report.json \
            mycompany-native-replenishment-report.json; do
            if [ -f "${{ runner.temp }}/rubrova-preflight/$report" ]; then
              cat "${{ runner.temp }}/rubrova-preflight/$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
