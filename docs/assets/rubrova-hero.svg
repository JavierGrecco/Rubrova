<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">Rubrova — gestión comercial local</title>
  <desc id="desc">Identidad visual de Rubrova con una red de operaciones locales: ventas, inventario, caja y analítica conectadas al núcleo POS y ERP.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071626"/>
      <stop offset="0.58" stop-color="#102b43"/>
      <stop offset="1" stop-color="#0b3a43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#50d6b1"/>
      <stop offset="1" stop-color="#6ca8ff"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#9bb9cd" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1440" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1230" cy="40" r="260" fill="#55d8b5" opacity=".055"/>
  <circle cx="1370" cy="330" r="210" fill="#74aaff" opacity=".08"/>
  <path d="M760 70C920 4 1070 55 1160 140S1310 285 1440 220" fill="none" stroke="#63d9b7" stroke-opacity=".2" stroke-width="2"/>
  <path d="M790 300C950 210 1040 250 1160 190S1340 85 1440 110" fill="none" stroke="#78aaff" stroke-opacity=".18" stroke-width="2"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <g transform="translate(82 76)">
      <rect x="0" y="0" width="58" height="58" rx="17" fill="url(#accent)"/>
      <path d="M15 31h28M29 16v30M18 21l22 22M40 21 18 43" stroke="#082338" stroke-width="3.3" stroke-linecap="round" opacity=".9"/>
      <circle cx="29" cy="29" r="7" fill="#f2fbff"/>
    </g>
    <text x="160" y="121" font-size="58" font-weight="750" letter-spacing="-2" fill="#f4f9ff">Rubrova</text>
    <text x="84" y="180" font-size="20" font-weight="650" letter-spacing="2.8" fill="#71dfc1">POS · ERP · INTELIGENCIA OPERATIVA</text>
    <text x="84" y="224" font-size="21" fill="#d2e0eb">La operación diaria del negocio, con datos coherentes y control local.</text>
    <g transform="translate(84 270)">
      <rect width="182" height="38" rx="19" fill="#153c4b" stroke="#4bd3ae" stroke-opacity=".65"/>
      <circle cx="20" cy="19" r="5" fill="#58d9b5"/>
      <text x="36" y="25" font-size="13" font-weight="700" letter-spacing="1.1" fill="#e7fff8">LOCAL FIRST</text>
      <rect x="198" width="220" height="38" rx="19" fill="#18344e" stroke="#76aaff" stroke-opacity=".55"/>
      <text x="218" y="25" font-size="13" font-weight="700" letter-spacing="1" fill="#e5f0ff">MODULAR · TRAZABLE</text>
    </g>
    <g transform="translate(900 66)">
      <rect x="0" y="0" width="440" height="228" rx="24" fill="#071a2a" fill-opacity=".55" stroke="#aac5d8" stroke-opacity=".24"/>
      <text x="28" y="36" font-size="12" font-weight="700" letter-spacing="2" fill="#9bb5c8">NÚCLEO OPERATIVO</text>
      <g transform="translate(28 58)">
        <rect width="178" height="64" rx="13" fill="#143d4b" stroke="#4fd3b0" stroke-opacity=".65"/>
        <text x="18" y="27" font-size="16" font-weight="700" fill="#effff9">POS</text>
        <text x="18" y="47" font-size="11" fill="#b5e8da">Venta · caja · pagos</text>
        <rect x="202" width="182" height="64" rx="13" fill="#1c3654" stroke="#78aaff" stroke-opacity=".65"/>
        <text x="220" y="27" font-size="16" font-weight="700" fill="#f1f6ff">ERP</text>
        <text x="220" y="47" font-size="11" fill="#c0d4f5">Stock · compras · costos</text>
      </g>
      <path d="M117 132v21h105v-21M295 132v21H222" fill="none" stroke="#83b9ce" stroke-width="1.7" stroke-linecap="round"/>
      <rect x="78" y="166" width="290" height="42" rx="12" fill="#172f43" stroke="#5cd5b3" stroke-opacity=".55"/>
      <circle cx="100" cy="187" r="5" fill="#61d9b8"/>
      <text x="116" y="192" font-size="13" font-weight="650" fill="#e2eff5">Datos · auditoría · decisiones</text>
    </g>
